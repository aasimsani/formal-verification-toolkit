name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same pull request cancels the run of the old push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: scripts, structure and core examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v10.3.3
      # The jars are pinned by checksum in fv-install, so the cache key follows that file.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/fv
          key: fv-jars-${{ hashFiles('plugins/fv-toolkit/scripts/fv-install') }}
      - name: Install the pinned checkers
        run: plugins/fv-toolkit/scripts/fv-install
      - name: Structure
        run: bash tests/test_structure.sh
      - name: Scripts
        run: bash tests/test_scripts.sh
      - name: Examples
        run: bash tests/test_examples.sh
